name: release

on:
  push:
    tags:
      - "v2*"

# One release at a time per ref; a re-pushed tag queues rather than racing the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Compute version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Version lock: the tag must match the package about to be baked into the image.
      # Pre-release tag spelling must match __version__ exactly (v2.0.0rc1 <-> 2.0.0rc1).
      # Full `pip install .` (not --no-deps): `import sk8s` needs its runtime deps.
      - name: Guard - package version must equal tag version
        run: |
          pip install .
          PKG_VERSION="$(python -c 'import sk8s; print(sk8s.__version__)')"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::tag version '$VERSION' != sk8s.__version__ '$PKG_VERSION'"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          # Conscious default (single arch); revisit when cloud targets untable.
          platforms: linux/amd64
          # Conscious default (no attestation manifest); revisit when cloud targets untable.
          provenance: false
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          push: true
          tags: ghcr.io/jared-maguire/sk8s:${{ env.VERSION }}-py${{ matrix.python-version }}

  # Expects this PyPI trusted-publisher entry: owner jared-maguire, repo jobs,
  # workflow release.yml, environment pypi.
  publish-pypi:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
