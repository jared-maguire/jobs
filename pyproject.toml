[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sk8s"
version = "2.0.0a0"
description = "Run Python functions on Kubernetes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "kubernetes>=29.0.0",
    "cloudpickle>=3.0.0",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
gcs = ["google-cloud-storage>=2.14"]
dev = ["pytest>=8", "pytest-timeout>=2", "mypy>=1.8", "boto3>=1.34", "google-cloud-storage>=2.14"]

[project.scripts]
sk8s = "sk8s.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Kubernetes cluster (SK8S_INTEGRATION=1)"]

[tool.mypy]
strict = true
packages = ["sk8s"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "google.cloud", "google.cloud.*"]
ignore_missing_imports = true
